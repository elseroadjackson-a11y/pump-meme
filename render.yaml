services:
  - type: web
    name: pump-meme
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /logo.png
    disk:
      name: pump-meme-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SECRET
        generateValue: true
      - key: MASTER_NAME
        value: jackson
      - key: MASTER_KEY
        sync: false
      - key: RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
